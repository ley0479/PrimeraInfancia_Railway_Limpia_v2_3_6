name: integrity-ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity-and-postgresql:
    name: Integrity Gate + PostgreSQL Migration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: primera_infancia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d primera_infancia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PYTHONUTF8: "1"
      APP_ENV: testing
      SECRET_KEY: ci-secret-key-primera-infancia-0123456789
      JWT_SECRET_KEY: ci-jwt-secret-key-primera-infancia-9876543210
      INITIAL_ADMIN_USERNAME: ci.admin
      INITIAL_ADMIN_EMAIL: ci.admin@example.invalid
      INITIAL_ADMIN_PASSWORD: Ci-Password-2026!
      INITIAL_ADMIN_FORCE_PASSWORD_CHANGE: "false"
      SINGLE_TENANT_MODE: "false"
      ALLOW_EXPERIMENTAL_MULTI_TENANT: "true"
      MULTI_TENANT_STRICT: "true"
      TENANT_STORAGE_ISOLATION: "true"
      MULTI_TENANT_SCHEMA_VERSION: "3"
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/primera_infancia_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-production.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-production.txt
          python -m pip install pytest

      - name: PostgreSQL preflight
        run: |
          mkdir -p "$RUNNER_TEMP/pi-evidence"
          python backend/tools/postgresql_preflight.py \
            --postgres "$POSTGRES_URL" \
            --report "$RUNNER_TEMP/pi-evidence/postgresql_preflight_ci.json"

      - name: Build clean SQLite source fixture
        env:
          DATA_DIR: /tmp/pi-sqlite-source
          DATABASE_PATH: /tmp/pi-sqlite-source/database.sqlite3
          DATABASE_URL: sqlite:////tmp/pi-sqlite-source/database.sqlite3
        run: |
          rm -rf /tmp/pi-sqlite-source
          mkdir -p /tmp/pi-sqlite-source
          python backend/init_hosting.py

      - name: Migrate SQLite to PostgreSQL
        run: |
          python backend/tools/migrate_sqlite_to_postgresql.py \
            --sqlite /tmp/pi-sqlite-source/database.sqlite3 \
            --postgres "$POSTGRES_URL" \
            --report "$RUNNER_TEMP/pi-evidence/ci_sqlite_to_postgresql.json"

      - name: Verify migrated data
        run: |
          python backend/tools/verify_sqlite_postgresql.py \
            --sqlite /tmp/pi-sqlite-source/database.sqlite3 \
            --postgres "$POSTGRES_URL" \
            --report "$RUNNER_TEMP/pi-evidence/ci_verify_sqlite_postgresql.json"

      - name: Smoke application on PostgreSQL
        env:
          DATA_DIR: /tmp/pi-postgres-runtime
          DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: |
          mkdir -p /tmp/pi-postgres-runtime
          python backend/init_hosting.py
          cd backend
          python - <<'PY'
          import app
          from database import database
          result = database.healthcheck()
          assert result["ok"], result
          assert result["dialect"] == "postgresql", result
          print(result)
          PY

      - name: Full integrity gate
        run: |
          python backend/tools/integrity_gate.py \
            --root "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/pi-evidence/integrity_gate_ci.json" \
            --skip-manifest

      - name: Safe repair policy dry run
        run: |
          python backend/tools/safe_repair.py \
            --root "$GITHUB_WORKSPACE" \
            --report "$RUNNER_TEMP/pi-evidence/safe_repair_plan_ci.json"

      # validate_release.py valida un paquete distribuible con SHA256SUMS y
      # estructura payload/. El checkout fuente no es ese artefacto; ejecutarlo
      # aquí producía fallos falsos por manifiestos de empaquetado históricos.
      - name: Release package validator replacement - Document Center regression
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          python backend/tests/test_centro_documental_core_v7.py
          python backend/tests/test_centro_documental_templates_v7.py
          python backend/tests/test_centro_documental_flow_v7.py
          python backend/tests/test_centro_documental_exports_v7.py
          python backend/tests/test_centro_documental_integrations_v7.py
          python backend/tests/test_centro_documental_http_v7.py

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-evidence/*.json
          if-no-files-found: warn
          retention-days: 30

  deployment-gate:
    name: Deployment Gate
    needs: integrity-and-postgresql
    runs-on: ubuntu-latest
    steps:
      - run: echo "Integrity and PostgreSQL checks passed. Deployment may continue."
